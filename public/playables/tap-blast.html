<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Tap Blast</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: radial-gradient(circle at 50% 20%, #ff7eb3, #7f53ac);
        color: #fff; display: flex; flex-direction: column;
        align-items: center; justify-content: center; user-select: none; touch-action: manipulation;
      }
      h1 { font-size: 26px; margin-bottom: 8px; text-shadow: 0 2px 8px rgba(0,0,0,.3); }
      #score { font-size: 64px; font-weight: 800; margin: 10px 0 24px; }
      #tap {
        width: 180px; height: 180px; border-radius: 50%; border: none; cursor: pointer;
        background: #fff; color: #7f53ac; font-size: 28px; font-weight: 800;
        box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: transform .08s;
      }
      #tap:active { transform: scale(.9); }
      .hint { margin-top: 22px; opacity: .85; font-size: 14px; }
      .burst { position: fixed; font-size: 28px; pointer-events: none; animation: fly .7s ease-out forwards; }
      @keyframes fly { to { transform: translateY(-80px) scale(1.6); opacity: 0; } }
    </style>
  </head>
  <body>
    <h1>Tap Blast</h1>
    <div id="score">0</div>
    <button id="tap">TAP!</button>
    <div class="hint">Демо-плейбл · нажимай на кнопку</div>
    <script>
      var score = 0;
      var scoreEl = document.getElementById('score');
      var btn = document.getElementById('tap');
      btn.addEventListener('click', function (e) {
        score += 1;
        scoreEl.textContent = score;
        var b = document.createElement('div');
        b.className = 'burst';
        b.textContent = ['💥', '✨', '⭐', '🔥'][score % 4];
        b.style.left = e.clientX - 14 + 'px';
        b.style.top = e.clientY - 14 + 'px';
        document.body.appendChild(b);
        setTimeout(function () { b.remove(); }, 700);
      });
    </script>
  </body>
</html>
